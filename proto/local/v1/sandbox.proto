syntax = "proto3";

package sandboxes.local.v1;

option go_package = "github.com/KLORQ/sandboxes-api/gen/go/local/v1;localv1";

message Sandbox {
  string id = 1;
  string name = 2;
  string state = 3;
  int64 generation = 4;
}

message CreateSandboxRequest {
  string name = 1;
  string image = 2;
  string workspace = 3;
  string idempotency_key = 4;
}

message CreateSandboxResponse {
  string operation_id = 1;
}

service SandboxService {
  rpc Create(CreateSandboxRequest) returns (CreateSandboxResponse);
}
