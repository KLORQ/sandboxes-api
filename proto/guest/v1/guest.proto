syntax = "proto3";

package sandboxes.guest.v1;

option go_package = "github.com/KLORQ/sandboxes-api/gen/go/guest/v1;guestv1";

message ExecRequest {
  repeated string argv = 1;
  string workdir = 2;
  bool tty = 3;
}

message ExecFrame {
  bytes data = 1;
  int32 exit_code = 2;
}

service GuestService {
  rpc Exec(stream ExecRequest) returns (stream ExecFrame);
}
