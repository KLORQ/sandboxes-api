syntax = "proto3";

package sandboxes.local.v1;

option go_package = "github.com/rheic/sandboxes-api/gen/go/sandboxes/local/v1;localv1";

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_PENDING = 1;
  SANDBOX_STATE_CREATING = 2;
  SANDBOX_STATE_RUNNING = 3;
  SANDBOX_STATE_STOPPING = 4;
  SANDBOX_STATE_STOPPED = 5;
  SANDBOX_STATE_DELETING = 6;
  SANDBOX_STATE_DELETED = 7;
  SANDBOX_STATE_FAILED = 8;
  SANDBOX_STATE_UNKNOWN = 9;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_CREATE = 1;
  OPERATION_KIND_START = 2;
  OPERATION_KIND_STOP = 3;
  OPERATION_KIND_DELETE = 4;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_DONE = 3;
  OPERATION_STATE_FAILED = 4;
}

enum RegistryCredentialScope {
  REGISTRY_CREDENTIAL_SCOPE_UNSPECIFIED = 0;
  REGISTRY_CREDENTIAL_SCOPE_HOST_ONLY = 1;
  REGISTRY_CREDENTIAL_SCOPE_ALL_SANDBOXES = 2;
  REGISTRY_CREDENTIAL_SCOPE_SANDBOX = 3;
}

message NetworkRule {
  string protocol = 1;
  string cidr = 2;
  uint32 port = 3;
  // Domain, wildcard (*.example.com), multi-label wildcard (**.example.com),
  // or a single-label glob. Mutually exclusive with cidr.
  string domain = 4;
  // Stable content-derived identifier for policy listing and removal.
  string rule_id = 5;
}

message Port {
  uint32 host = 1;
  uint32 guest = 2;
  string protocol = 3;
  string host_ip = 4;
}

message Workspace {
  string path = 1;
  bool read_only = 2;
}

message Sandbox {
  string id = 1;
  string name = 2;
  SandboxState state = 3;
  int64 generation = 4;
  string image = 5;
  string workspace = 6;
  string error = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
  uint32 cpus = 10;
  uint32 memory_mib = 11;
  int64 stopped_at_unix = 12;
  repeated Workspace workspaces = 13;
  repeated Port ports = 14;
  repeated NetworkRule allow = 15;
  repeated NetworkRule deny = 16;
  string agent = 17;
  bool detached = 18;
  int64 last_used_at_unix = 19;
  int64 last_used_at_unix_nano = 20;
  string policy_profile = 21;
}

message Operation {
  string id = 1;
  string sandbox_id = 2;
  OperationKind kind = 3;
  OperationState state = 4;
  int64 generation = 5;
  string error = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
}

message CreateRequest {
  string name = 1;
  string image = 2;
  string workspace = 3;
  string idempotency_key = 4;
  // Zero selects the daemon default for each resource.
  uint32 cpus = 5;
  uint32 memory_mib = 6;
  repeated Workspace workspaces = 7;
  repeated Port ports = 8;
  repeated NetworkRule allow = 9;
  repeated NetworkRule deny = 10;
  string agent = 11;
  bool detached = 12;
  // Environment baked into the sandbox for every process, including exec.
  // Values are not persisted in sandbox state.
  map<string, string> env = 13;
  string policy_profile = 14;
  // Runs the sandbox with the dedicated privileged Docker profile.
  bool privileged = 15;
  // OAuth kit metadata only; never put real access or refresh tokens here.
  repeated OAuthCredential oauth_credentials = 16;
}

// OAuthCredential mirrors the Docker Sandboxes v2 OAuth kit declaration.
// Values are configuration metadata; real tokens remain host-side unless the
// explicitly weaker passthrough mode is selected.
message OAuthCredential {
  string service = 1;
  OAuthTokenEndpoint token_endpoint = 2;
  repeated string resource_hosts = 3;
  OAuthSentinels sentinels = 4;
  OAuthCredentialFile credential_file = 5;
  OAuthResponseFields response_fields = 6;
  bool passthrough = 7;
  // Carried for Docker v2 schema compatibility; it does not grant access.
  repeated string skip_if_env = 8;
}

message OAuthTokenEndpoint {
  string host = 1;
  string path = 2;
}

message OAuthSentinels {
  string access_token = 1;
  string refresh_token = 2;
}

message OAuthCredentialFile {
  string path = 1;
  // JSON-encoded structure object; structure takes precedence over template.
  string structure_json = 2;
  string template = 3;
}

message OAuthResponseFields {
  string access_token = 1;
  string refresh_token = 2;
  string expires_in = 3;
  string scope = 4;
  string id_token = 5;
}

message GetRequest {
  string id = 1;
}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message GetResponse {
  Sandbox sandbox = 1;
}

message ListResponse {
  repeated Sandbox items = 1;
  string next_page_token = 2;
}

message StartRequest {
  string id = 1;
}

message StopRequest {
  string id = 1;
  int64 grace_seconds = 2;
}

message DeleteRequest {
  string id = 1;
  bool force = 2;
}

message OperationServiceGetRequest {
  string id = 1;
}

message OperationServiceWaitRequest {
  string id = 1;
}

message WatchRequest {
  string sandbox_id = 1;
  int64 after_revision = 2;
}

message WatchResponse {
  string type = 1;
  Sandbox sandbox = 2;
  Operation operation = 3;
  int64 revision = 4;
}

message CreateResponse {
  Operation operation = 1;
}

message StartResponse {
  Operation operation = 1;
}

message StopResponse {
  Operation operation = 1;
}

message DeleteResponse {
  Operation operation = 1;
}

message ExecRequest {
  string sandbox_id = 1;
  repeated string argv = 2;
  string workdir = 3;
  // Explicit KEY=VALUE overrides. Host environment variables are never copied.
  repeated string env = 4;
  // Numeric uid[:gid] or local guest user/group names when supported by the guest.
  string user = 5;
}

message ExecResponse {
  oneof frame {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
}

// The first frame opens a session. Subsequent frames carry input, terminal
// resize events, or an explicit stdin EOF.
message ExecSessionOpen {
  string sandbox_id = 1;
  repeated string argv = 2;
  string workdir = 3;
  bool tty = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  // Explicit KEY=VALUE overrides. Host environment variables are never copied.
  repeated string env = 7;
  // Numeric uid[:gid] or local guest user/group names when supported by the guest.
  string user = 8;
}

message ExecSessionResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecSessionRequest {
  oneof frame {
    ExecSessionOpen open = 1;
    bytes stdin = 2;
    ExecSessionResize resize = 3;
    bool stdin_eof = 4;
  }
}

message ExecSessionResponse {
  oneof frame {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
}

message OperationServiceGetResponse {
  Operation operation = 1;
}

message OperationServiceWaitResponse {
  Operation operation = 1;
}

message RegistryCredentialServiceLoginRequest {
  string registry = 1;
  string username = 2;
  bytes password = 3;
  RegistryCredentialScope scope = 4;
  string sandbox_name = 5;
}

message RegistryCredentialServiceLoginResponse {
  string registry = 1;
  string username = 2;
  RegistryCredentialScope scope = 3;
  string sandbox_name = 4;
}

message RegistryCredentialServiceLogoutRequest {
  string registry = 1;
  RegistryCredentialScope scope = 2;
  string sandbox_name = 3;
}

message RegistryCredentialServiceListRequest {}

message RegistryCredentialSummary {
  string registry = 1;
  string username = 2;
  string scope = 3;
  string sandbox_name = 4;
}

message RegistryCredentialServiceListResponse {
  repeated RegistryCredentialSummary credentials = 1;
}

message RegistryCredentialServiceLogoutResponse {
  bool removed = 1;
}

// SecretSource stores a host-side resolver configuration instead of a
// credential value. A command is user-supplied host shell text and is replayed
// by the daemon on verification/refresh. This message must never be sent to a guest.
message SecretSource {
  string reference = 1;
  string refresh = 2;
  bool no_verify = 3;
  bool show_error = 4;
  string command = 5;
  string op_account = 6;
  string aws_profile = 7;
}

message SecretServiceSetRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
  bytes value = 4;
  SecretSource source = 5;
}

message SecretSummary {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
}

message SecretServiceSetResponse {
  SecretSummary secret = 1;
}

message SecretServiceCreateRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
  bytes value = 4;
  SecretSource source = 5;
}

message SecretServiceCreateResponse {
  SecretSummary secret = 1;
}

message SecretServiceListRequest {}

message SecretServiceListResponse {
  repeated SecretSummary secrets = 1;
}

message SecretServiceRemoveRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
}

message SecretServiceRemoveResponse {
  bool removed = 1;
}

message AccountServiceLoginRequest {
  string provider = 1;
}

message AccountServiceLoginResponse {
  string provider = 1;
  bool authenticated = 2;
}

message AccountServiceLoginWithPATRequest {
  string username = 1;
  bytes password = 2;
}

message AccountServiceLoginWithPATResponse {
  bool authenticated = 1;
}

message AccountServiceLogoutRequest {
  string provider = 1;
}

message AccountServiceLogoutResponse {
  bool removed = 1;
}

message AccountServiceStatusRequest {
  string provider = 1;
}

message AccountServiceStatusResponse {
  string provider = 1;
  bool credential_present = 2;
  // refresh_present reports that a usable refresh token is stored, without
  // exposing token material, expiry values or validity claims.
  bool refresh_present = 3;
  // refresh_coordinated reports that the daemon coordinates refresh for this
  // credential (single-flight rotation); false means no refresh is scheduled.
  bool refresh_coordinated = 4;
}

// The device-login stream keeps the device code on the daemon. The user code
// and verification URL are intentionally returned so the caller can complete
// the provider's interactive handoff before polling begins.
message AccountServiceLoginDeviceRequest {
  string provider = 1;
  bool continue_after_handoff = 2;
}

message AccountServiceLoginDeviceResponse {
  string user_code = 1;
  string verification_uri = 2;
  bool authenticated = 3;
}

message UpdatePolicyRequest {
  string id = 1;
  repeated NetworkRule allow = 2;
  repeated NetworkRule deny = 3;
}

message UpdatePolicyResponse {
  Sandbox sandbox = 1;
}

message MutatePolicyRequest {
  string id = 1;
  string action = 2;
  NetworkRule rule = 3;
}

message MutatePolicyResponse {
  Sandbox sandbox = 1;
}

message UpdatePortsRequest {
  string id = 1;
  repeated Port ports = 2;
}

message UpdatePortsResponse {
  Sandbox sandbox = 1;
}

message GetGlobalPolicyRequest {}

message GetGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
}

message MutateGlobalPolicyRequest {
  string action = 1;
  NetworkRule rule = 2;
}

message MutateGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
}

message RefreshPoliciesRequest {}

message RefreshPoliciesResponse {
  // applied is the number of running sandboxes that accepted the refresh.
  int32 applied = 1;
  // skipped is the number of sandboxes that did not need a refresh.
  int32 skipped = 2;
}

message ResetGlobalPolicyRequest {}

message ResetGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
  string profile = 3;
}

message CheckPolicyRequest {
  string sandbox_id = 1;
  string protocol = 2;
  string address = 3;
  string domain = 4;
  uint32 port = 5;
}

message CheckPolicyResponse {
  bool allowed = 1;
  string rule_id = 2;
  string reason = 3;
}

// MCPCall invokes one tool on an MCP server registered for a sandbox. The
// daemon resolves the server from its own registry, verifies that the sandbox
// is running, and obtains any required approval through a trusted host
// provider. Client input is never an approval grant or an executable command.
// Deployments must enforce applicable policy before host execution; this RPC
// does not itself define or evaluate an MCP policy.
message MCPCallRequest {
  string sandbox_id = 1;
  string server_name = 2;
  string tool_name = 3;
  // UTF-8 JSON object containing tool arguments, at most 1 MiB. The daemon
  // validates the JSON before forwarding it.
  string arguments_json = 4;
}

message MCPCallResponse {
  // UTF-8 JSON tool result, at most 4 MiB.
  string result_json = 1;
  // When true, the daemon created a short-lived one-use approval challenge.
  // No tool was executed and result_json is empty. Clients must display the
  // challenge to the user and call MCPApproveCall before returning a result.
  bool approval_required = 2;
  string approval_id = 3;
  // Human-readable, non-secret explanation for the approval prompt.
  string approval_reason = 4;
}

message MCPApproveCallRequest {
  // One-use daemon-issued challenge returned by MCPCall. This only selects
  // the pending operation; it is not proof of user approval. The daemon must
  // obtain approval through its trusted host approval provider before execution.
  string approval_id = 1;
  reserved 2;
}

message MCPApproveCallResponse {
  // UTF-8 JSON tool result, at most 4 MiB when approved and executed.
  string result_json = 1;
}

message MCPRegisterServerRequest {
  string name = 1;
  // Explicit host executable path; never interpreted by a shell. Exactly one
  // of command or url must be set.
  string command = 2;
  // Non-secret command configuration only. Daemon registry metadata is stored
  // in local state; credentials must use a host credential broker instead.
  repeated string arguments = 3;
  // Absolute host working directory. The daemon validates and pins its
  // identity before launching this command.
  string working_directory = 4;
  // Remote streamable-HTTP transport: an https URL constrained by the
  // daemon's fail-closed host allowlist. Exactly one of command or url must
  // be set.
  string url = 5;
  // Deprecated: static remote request headers are rejected by supported
  // daemons because sensitivity cannot be inferred from a custom header name.
  // Use secret_headers with host-vault placeholder references.
  map<string, string> headers = 6;
  // Host-vault-backed request header templates. Values may contain only
  // literal formatting text and ${placeholder} references; secret material
  // itself must never cross this RPC or be persisted in registry state.
  map<string, string> secret_headers = 7;
}

message MCPRegisterServerResponse {
  MCPServerSummary server = 1;
  // Registration never starts the server. Host process execution begins only
  // after the daemon's trusted host approval provider authorizes the challenge.
  bool approval_required = 2;
  string approval_id = 3;
}

message MCPApproveRegistrationRequest {
  // This selects the pending registration; it is not proof of user approval.
  // The daemon must consult its trusted host approval provider.
  string approval_id = 1;
  reserved 2;
}

message MCPApproveRegistrationResponse {
  MCPServerSummary server = 1;
}

message MCPRemoveServerRequest {
  string name = 1;
}

message MCPRemoveServerResponse {
  bool removed = 1;
}

// MCPServerSummary is a redacted view of a server in the daemon-owned registry.
// It intentionally excludes command arguments, headers, credentials, and
// OAuth identity details.
message MCPServerSummary {
  string name = 1;
  // gateway identifies the local gateway or remote control plane responsible
  // for the server; it is a display value, not an address or authorization.
  string gateway = 2;
  // transport is an extensible lowercase label such as stdio, streamable-http,
  // sse, or oci.
  string transport = 3;
  bool loaded = 4;
  bool usable = 5;
  bool auth_required = 6;
  bool auth_configured = 7;
  bool has_custom_headers = 8;
  bool custom_headers_supported = 9;
  bool custom_header_secrets_configured = 10;
}

// ListMCPServers returns only daemon-known MCP server summaries. It never
// starts servers or authentication flows. An optional sandbox ID limits the
// result to servers requested by that sandbox and includes skipped entries so
// callers can explain why a server is unavailable.
message ListMCPServersRequest {
  string sandbox_id = 1;
}

message ListMCPServersResponse {
  repeated MCPServerSummary servers = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string api_version = 2;
}

service SandboxService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc ExecSession(stream ExecSessionRequest) returns (stream ExecSessionResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc MutatePolicy(MutatePolicyRequest) returns (MutatePolicyResponse);
  rpc UpdatePorts(UpdatePortsRequest) returns (UpdatePortsResponse);
  rpc GetPolicyProfile(GetPolicyProfileRequest) returns (GetPolicyProfileResponse);
  rpc SetPolicyProfile(SetPolicyProfileRequest) returns (SetPolicyProfileResponse);
  rpc GetGlobalPolicy(GetGlobalPolicyRequest) returns (GetGlobalPolicyResponse);
  rpc MutateGlobalPolicy(MutateGlobalPolicyRequest) returns (MutateGlobalPolicyResponse);
  rpc CheckPolicy(CheckPolicyRequest) returns (CheckPolicyResponse);
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  rpc MCPRegisterServer(MCPRegisterServerRequest) returns (MCPRegisterServerResponse);
  rpc MCPApproveRegistration(MCPApproveRegistrationRequest) returns (MCPApproveRegistrationResponse);
  rpc MCPRemoveServer(MCPRemoveServerRequest) returns (MCPRemoveServerResponse);
  rpc MCPCall(MCPCallRequest) returns (MCPCallResponse);
  rpc MCPApproveCall(MCPApproveCallRequest) returns (MCPApproveCallResponse);
  rpc RefreshPolicies(RefreshPoliciesRequest) returns (RefreshPoliciesResponse);
  rpc ResetGlobalPolicy(ResetGlobalPolicyRequest) returns (ResetGlobalPolicyResponse);
}

message GetPolicyProfileRequest {}

message GetPolicyProfileResponse {
  string profile = 1;
}

message SetPolicyProfileRequest {
  string profile = 1;
}

message SetPolicyProfileResponse {
  string profile = 1;
}

service OperationService {
  rpc Get(OperationServiceGetRequest) returns (OperationServiceGetResponse);
  rpc Wait(OperationServiceWaitRequest) returns (OperationServiceWaitResponse);
}

service RegistryCredentialService {
  rpc Login(RegistryCredentialServiceLoginRequest) returns (RegistryCredentialServiceLoginResponse);
  rpc Logout(RegistryCredentialServiceLogoutRequest) returns (RegistryCredentialServiceLogoutResponse);
  rpc List(RegistryCredentialServiceListRequest) returns (RegistryCredentialServiceListResponse);
}

service SecretService {
  rpc Set(SecretServiceSetRequest) returns (SecretServiceSetResponse);
  rpc Create(SecretServiceCreateRequest) returns (SecretServiceCreateResponse);
  rpc List(SecretServiceListRequest) returns (SecretServiceListResponse);
  rpc Remove(SecretServiceRemoveRequest) returns (SecretServiceRemoveResponse);
}

service AccountService {
  rpc Login(AccountServiceLoginRequest) returns (AccountServiceLoginResponse);
  rpc LoginDevice(stream AccountServiceLoginDeviceRequest) returns (stream AccountServiceLoginDeviceResponse);
  rpc LoginWithPAT(AccountServiceLoginWithPATRequest) returns (AccountServiceLoginWithPATResponse);
  rpc Logout(AccountServiceLogoutRequest) returns (AccountServiceLogoutResponse);
  rpc Status(AccountServiceStatusRequest) returns (AccountServiceStatusResponse);
}
